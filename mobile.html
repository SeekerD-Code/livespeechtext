<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Speech Text - Mobile Edition</title>
    
    <link rel="stylesheet" href="css/main.css?v=1.0">
    <link rel="stylesheet" href="css/style-base.css?v=1.0">
    <link rel="stylesheet" href="css/style-lingua.css?v=1.0">
    <link rel="stylesheet" href="css/style-pwa.css?v=1.0">
    <link rel="stylesheet" href="css/style-mobile.css?v=1.0">

    <style>
    /* Nasconde tutte le sezioni tranne quella attiva */
    .tab-content {
        display: none;
    }
    .tab-content.active {
        display: block;
    }
    </style>
    
    <script>
        if (window.location.protocol !== 'file:') {
            const hasCookieBlock = document.cookie.split('; ').some(row => row.startsWith('block_ads='));

            if (localStorage.getItem('block_ads') === 'true' || hasCookieBlock) {
                console.log("Modalità Sviluppatore Attiva: AdSense inibito.");
            } else {
                const adsenseScript = document.createElement('script');
                adsenseScript.async = true;
                adsenseScript.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9544811471414500";
                adsenseScript.crossOrigin = "anonymous";
                document.head.appendChild(adsenseScript);
            }
        }
    </script>
</head>
<body>
    <div class="app-container">
        
        <header class="brand-header">
            <div class="logo">
                <span class="seeker-text">🎙️ Live Speech Text</span> 
                <span class="mobile-badge-text">Mobile</span>
            </div>
            
            <nav class="main-nav">
                <a href="https://seekerdcode.it" class="nav-link">Home Page</a>
                <a href="#" id="link-app" class="nav-link active">App</a>
                <a href="#" id="link-about" class="nav-link">About Us</a>
                <a href="#" id="link-faq" class="nav-link">FAQ</a>
            </nav>
        </header>

        <main class="container">
            <section id="sezione-app" class="tab-content active">
                <p class="app-description">Trascrizione vocale ottimizzata per il tuo smartphone. Parla liberamente.</p>
                
                <div class="controls-section">
                    <button id="btn-ascolto" class="btn-primary">🎤 Trascrivi da Microfono</button>
                    <button id="btn-cancella" class="btn-danger">🗑️ Cancella</button>
                </div>

                <div class="status-badge" id="stato-app">Pronto ad ascoltare</div>

                <div class="international-section">
                    <label for="select-lingua" class="theme-label">🎤 Lingua Lezione / Input:</label>
                    <select id="select-lingua" class="theme-select">
                        <option value="it-IT">Italiano (Italia)</option>
                        <option value="en-US">English (US)</option>
                        <option value="es-ES">Español (España)</option>
                        <option value="fr-FR">Français (France)</option>
                        <option value="de-DE">Deutsch (Deutschland)</option>
                    </select>
                </div>

                <textarea id="area-appunti" placeholder="Il testo definitivo apparirà qui. Puoi modificarlo liberamente mentre l'app ascolta!"></textarea>

                <div class="ads-container-mobile">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-9544811471414500"
                         data-ad-slot="4489947913"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                    <script>
                         (adsbygoogle = window.adsbygoogle || []).push({});
                    </script>
                </div>
                
                <div id="box-anteprima-ia" class="anteprima-azzurra">
                    In attesa della voce...
                </div>

                <div class="download-section">
                    <button id="btn-download" class="btn-success" style="display: none; width: 100%;">💾 Scarica Appunti (.txt)</button>
                </div>
            </section>

            <section id="sezione-about" class="tab-content">
                <h2>About Us</h2>
                <p>Applicazione di trascrizione ottimizzata per dispositivi mobili.</p>
            </section>

            <section id="sezione-faq" class="tab-content">
                <h2>Domande Frequenti (FAQ)</h2>
                <div class="accordion"></div>
            </section>
        </main>
    </div>

    <script src="js/app-mobile.js?v=1.0"></script>
    <script src="js/faq-data.js?v=1.0"></script>
</body>
</html>
