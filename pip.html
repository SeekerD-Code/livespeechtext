<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>LiveSpeech Fluttuante</title>
</head>
<body>
    <div class="pip-container" style="padding: 15px; height: 100vh; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; justify-content: space-between;">
        
        <div class="top-box" style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1; height: 100%;">
            
            <div id="stato-app-mini" class="status-badge" style="margin: 0; width: 100%; text-align: center; flex-shrink: 0;">
                Pronto ad ascoltare
            </div>
            
            <div class="pip-buttons-row" style="display: flex; gap: 8px; flex-shrink: 0; position: relative;">
                <button id="btn-lingua-mini" class="btn-primary" style="flex: 1; padding: 6px; font-size: 0.9rem; border-radius: 6px; cursor: pointer;">🌐 IT</button>
                
                <div id="lista-lingue-mini" class="menu-lingue-mini" style="display: none; position: absolute; top: 100%; left: 0; background: var(--bg-card, #fff); border: 1px solid var(--border-color, #ccc); padding: 5px; border-radius: 6px; z-index: 100; min-width: 120px;">
                    <span data-lang="it-IT" style="display: block; padding: 5px; cursor: pointer;">🇮🇹 Italiano</span>
                    <span data-lang="en-US" style="display: block; padding: 5px; cursor: pointer;">🇺🇸 English</span>
                    <span data-lang="es-ES" style="display: block; padding: 5px; cursor: pointer;">🇪🇸 Español</span>
                    <span data-lang="fr-FR" style="display: block; padding: 5px; cursor: pointer;">🇫🇷 Français</span>
                    <span data-lang="de-DE" style="display: block; padding: 5px; cursor: pointer;">🇩🇪 Deutsch</span>
                </div>

                <button id="btn-ascolto-mini" style="flex: 1; padding: 6px; font-size: 0.9rem; border-radius: 6px; cursor: pointer;">🎤</button>
                <button id="btn-call-mini" style="flex: 1; padding: 6px; font-size: 0.9rem; border-radius: 6px; cursor: pointer;">💻</button>
                <button id="btn-cancella-mini" style="flex: 1; padding: 6px; font-size: 0.9rem; border-radius: 6px; cursor: pointer;">🗑️</button>
            </div>
            
            <textarea id="area-appunti-mini" style="flex-grow: 1; width: 100%; font-family: inherit; padding: 10px; box-sizing: border-box; border-radius: 8px; resize: none;" placeholder="Il testo definitivo apparirà qui e puoi modificarlo..."></textarea>
            
            <div id="box-anteprima-mini" class="anteprima-azzurra" style="background-color: #eff6ff; color: #1e40af; padding: 8px 12px; border-radius: 6px; font-style: italic; font-size: 0.85rem; border: 1px dashed #bfdbfe; text-align: left; flex-shrink: 0; min-height: 40px; box-sizing: border-box;">
                In attesa della voce...
            </div>
            
        </div>

        <div class="advertising-space" style="margin-top: 5px; flex-shrink: 0;">
            <div id="banner-principale" style="line-height: 40px; height: 40px; text-align: center; border: 1px dashed #ccc; border-radius: 6px; font-size: 0.8rem;">
                Space Advertising
            </div>
        </div>

    </div>
</body>
</html>
